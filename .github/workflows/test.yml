name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build JellyVision Roku project
        run: npm run build

      - name: Save build output as artifact
        uses: actions/upload-artifact@v7
        with:
          name: JellyVision-Roku-dev-${{ github.sha }}
          path: ${{ github.workspace }}/build/staging
